# =============================================================================
#  Deploy - manual promotion: dev -> test -> uat -> approval -> prod
# =============================================================================
#  Same model as the Jenkinsfile. Pick the HIGHEST environment to reach; every
#  lower environment is deployed and smoke tested first. Choosing `uat` runs
#  dev, then test, then uat.
#
#  Required GitHub configuration (see GitHub-Actions-README.md):
#    * Repository secrets ANYPOINT_CLIENT_ID / ANYPOINT_CLIENT_SECRET.
#    * Environments dev, test, uat, prod - each with the MULE_ENC_KEY secret
#      and (optionally) the APP_BASE_URL variable for the smoke test.
#    * Required reviewers + "main only" branch rule on the prod environment.
#      That is the production approval gate.
# =============================================================================
name: Deploy
run-name: Deploy ${{ github.ref_name }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Highest environment to promote to. Every lower environment is deployed first.
        type: choice
        options: [dev, test, uat, prod]
        default: dev
        required: true
      skip_tests:
        description: Skip MUnit. Emergency hotfix only, never a normal release.
        type: boolean
        default: false
      enforce_coverage:
        description: Fail when MUnit coverage is below the thresholds in pom.xml.
        type: boolean
        default: true
      publish_to_exchange:
        description: Also publish the artifact to Anypoint Exchange.
        type: boolean
        default: false

permissions:
  contents: read

# One promotion at a time; a second run queues rather than cancelling a deploy
# half way through (the equivalent of disableConcurrentBuilds()).
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  MAVEN_OPTS: -Xmx1024m -Djava.awt.headless=true
  MVN_FLAGS: -B -ntp -s .ci/maven-settings.xml

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      app_name: ${{ steps.meta.outputs.app_name }}
      app_version: ${{ steps.meta.outputs.app_version }}
    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      TARGET_ENV: ${{ inputs.environment }}
      GIT_REF: ${{ github.ref }}
    steps:
      - name: Only main can reach production
        if: ${{ inputs.environment == 'prod' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production deploys must run from refs/heads/main, not ${GIT_REF}."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Anypoint credentials
        run: bash .ci/require-env.sh ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET

      - name: Read artifact coordinates
        id: meta
        # Read once so every later job names the same artifact.
        run: |
          app_name="$(mvn $MVN_FLAGS -q help:evaluate -Dexpression=project.artifactId -DforceStdout)"
          app_version="$(mvn $MVN_FLAGS -q help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "app_name=${app_name}" >> "$GITHUB_OUTPUT"
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "### ${app_name}:${app_version} → ${TARGET_ENV}" >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: mvn $MVN_FLAGS clean package -DskipMunitTests

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: mule-application
          path: target/*-mule-application.jar
          if-no-files-found: error
          retention-days: 30

  munit:
    name: MUnit
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      ENFORCE_COVERAGE: ${{ inputs.enforce_coverage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Anypoint credentials
        run: bash .ci/require-env.sh ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET

      - name: Run MUnit
        # -DskipMunitTests is the MUnit switch; -DskipTests does NOT skip it.
        run: mvn $MVN_FLAGS test -Dmunit.coverage.failBuild="$ENFORCE_COVERAGE"

      - name: MUnit summary
        if: ${{ !cancelled() }}
        run: bash .ci/munit-summary.sh target/surefire-reports >> "$GITHUB_STEP_SUMMARY"

      - name: Upload MUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: munit-reports
          path: |
            target/surefire-reports/
            target/site/munit/coverage/
          if-no-files-found: ignore
          retention-days: 30

  exchange:
    name: Publish to Exchange
    needs: [build, munit]
    # munit may be skipped (skip_tests); a skipped job must not block this one.
    if: >-
      ${{ !cancelled() && inputs.publish_to_exchange
      && needs.build.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.munit.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Anypoint credentials
        run: bash .ci/require-env.sh ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET

      - name: Publish
        run: mvn $MVN_FLAGS deploy -DskipMunitTests

  # ---------------------------------------------------------------------------
  #  Promotion chain. Every condition is explicit (!cancelled() + result
  #  checks): GitHub's implicit success() also looks at skipped ancestors,
  #  which would silently skip the chain whenever MUnit or Exchange is skipped.
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: dev
    needs: [build, munit, exchange]
    if: >-
      ${{ !cancelled()
      && needs.build.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.munit.result)
      && contains(fromJSON('["success","skipped"]'), needs.exchange.result) }}
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: dev
      app_name: ${{ needs.build.outputs.app_name }}
      app_version: ${{ needs.build.outputs.app_version }}
    secrets: inherit

  deploy-test:
    name: test
    needs: [build, deploy-dev]
    if: >-
      ${{ !cancelled() && needs.deploy-dev.result == 'success'
      && contains(fromJSON('["test","uat","prod"]'), inputs.environment) }}
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: test
      app_name: ${{ needs.build.outputs.app_name }}
      app_version: ${{ needs.build.outputs.app_version }}
    secrets: inherit

  deploy-uat:
    name: uat
    needs: [build, deploy-test]
    if: >-
      ${{ !cancelled() && needs.deploy-test.result == 'success'
      && contains(fromJSON('["uat","prod"]'), inputs.environment) }}
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: uat
      app_name: ${{ needs.build.outputs.app_name }}
      app_version: ${{ needs.build.outputs.app_version }}
    secrets: inherit

  deploy-prod:
    name: prod
    needs: [build, deploy-uat]
    # The approval gate is the prod environment's required reviewers: this job
    # waits for approval before it starts.
    if: >-
      ${{ !cancelled() && needs.deploy-uat.result == 'success'
      && inputs.environment == 'prod' }}
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: prod
      app_name: ${{ needs.build.outputs.app_name }}
      app_version: ${{ needs.build.outputs.app_version }}
    secrets: inherit

  result:
    name: Result
    needs: [build, munit, exchange, deploy-dev, deploy-test, deploy-uat, deploy-prod]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        env:
          NEEDS: ${{ toJSON(needs) }}
          TARGET_ENV: ${{ inputs.environment }}
          APP: ${{ needs.build.outputs.app_name }}:${{ needs.build.outputs.app_version }}
        run: |
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::FAILED promoting ${APP} to ${TARGET_ENV} (failed: ${failed})"
            # Notify here, e.g. slackapi/slack-github-action with a webhook secret.
            exit 1
          fi
          echo "SUCCESS: ${APP} promoted to ${TARGET_ENV}" | tee -a "$GITHUB_STEP_SUMMARY"
